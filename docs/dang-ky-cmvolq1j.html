<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Webinar Content that sells 31.10</title>
</head>
<body>
<!--
  Form HTML SBO — chỉnh bố cục / class CSS bên dưới.
  API đăng ký: https://mettalife.sboc.vn/api/p/mettalife/event/cmvolq1jw0001jp08qr6yayhe/register
  Sau khi sửa trường trong ERP, xuất lại HTML để cập nhật.
-->
<div class="sbo-event-form-root" data-sbo-event-root data-sbo-api-url="https://mettalife.sboc.vn/api/p/mettalife/event/cmvolq1jw0001jp08qr6yayhe/register">
  <form class="sbo-event-form" data-sbo-event-form novalidate style="--sbo-primary: #596788;">
    <h2 class="sbo-event-form__title">Webinar Content that sells 31.10</h2>
    

    <label class="sbo-field">
      <span class="sbo-field__label">Họ và tên <span class="sbo-required" aria-hidden="true">*</span></span>
      <input class="sbo-field__control" type="text" name="name" autocomplete="name" required />
    </label>

    <label class="sbo-field">
      <span class="sbo-field__label">Số điện thoại <span class="sbo-required" aria-hidden="true">*</span></span>
      <input class="sbo-field__control" type="tel" name="phone" autocomplete="tel" required />
    </label>

    <label class="sbo-field">
      <span class="sbo-field__label">Email <span class="sbo-required" aria-hidden="true">*</span></span>
      <input class="sbo-field__control" type="email" name="email" autocomplete="email" required />
    </label>

    <label class="sbo-field" data-sbo-field="f5e32360-2c8c-4f09-b9c1-afac8ec187d7">
  <span class="sbo-field__label">Ngành kinh doanh của bạn là gì? <span class="sbo-required" aria-hidden="true">*</span></span>
  <input class="sbo-field__control" type="text" data-sbo-custom="f5e32360-2c8c-4f09-b9c1-afac8ec187d7" required />
</label>

  <fieldset class="sbo-field sbo-field--group" data-sbo-field="e9325579-2e1b-4fe0-96bd-c6f9f3869718">
  <legend class="sbo-field__label">Doanh nghiệp của bạn hiện tại có bao nhiêu người? <span class="sbo-required" aria-hidden="true">*</span></legend>
  <div class="sbo-field__choices">
    <label class="sbo-choice">
      <input type="radio" name="sbo_radio_e9325579-2e1b-4fe0-96bd-c6f9f3869718" value="1 mình tôi" data-sbo-custom="e9325579-2e1b-4fe0-96bd-c6f9f3869718" required />
      <span>1 mình tôi</span>
    </label>
    <label class="sbo-choice">
      <input type="radio" name="sbo_radio_e9325579-2e1b-4fe0-96bd-c6f9f3869718" value="Dưới 5 người" data-sbo-custom="e9325579-2e1b-4fe0-96bd-c6f9f3869718" />
      <span>Dưới 5 người</span>
    </label>
    <label class="sbo-choice">
      <input type="radio" name="sbo_radio_e9325579-2e1b-4fe0-96bd-c6f9f3869718" value="Từ 5-10 người" data-sbo-custom="e9325579-2e1b-4fe0-96bd-c6f9f3869718" />
      <span>Từ 5-10 người</span>
    </label>
    <label class="sbo-choice">
      <input type="radio" name="sbo_radio_e9325579-2e1b-4fe0-96bd-c6f9f3869718" value="Trên 10 người" data-sbo-custom="e9325579-2e1b-4fe0-96bd-c6f9f3869718" />
      <span>Trên 10 người</span>
    </label>
  </div>
</fieldset>

  <fieldset class="sbo-field sbo-field--group" data-sbo-field="6ef108e7-b86e-46f1-97c1-54f85728e0c6">
  <legend class="sbo-field__label">Doanh thu trung bình/tháng của bạn là bao nhiêu? <span class="sbo-required" aria-hidden="true">*</span></legend>
  <div class="sbo-field__choices">
    <label class="sbo-choice">
      <input type="radio" name="sbo_radio_6ef108e7-b86e-46f1-97c1-54f85728e0c6" value="Dưới 20 triệu" data-sbo-custom="6ef108e7-b86e-46f1-97c1-54f85728e0c6" required />
      <span>Dưới 20 triệu</span>
    </label>
    <label class="sbo-choice">
      <input type="radio" name="sbo_radio_6ef108e7-b86e-46f1-97c1-54f85728e0c6" value="Từ 20-50 triệu" data-sbo-custom="6ef108e7-b86e-46f1-97c1-54f85728e0c6" />
      <span>Từ 20-50 triệu</span>
    </label>
    <label class="sbo-choice">
      <input type="radio" name="sbo_radio_6ef108e7-b86e-46f1-97c1-54f85728e0c6" value="Từ 50-100 triệu" data-sbo-custom="6ef108e7-b86e-46f1-97c1-54f85728e0c6" />
      <span>Từ 50-100 triệu</span>
    </label>
    <label class="sbo-choice">
      <input type="radio" name="sbo_radio_6ef108e7-b86e-46f1-97c1-54f85728e0c6" value="Trên 100 triệu" data-sbo-custom="6ef108e7-b86e-46f1-97c1-54f85728e0c6" />
      <span>Trên 100 triệu</span>
    </label>
  </div>
</fieldset>

  <label class="sbo-field" data-sbo-field="ca50196c-53d5-4752-bdf8-957cbd04cd64">
  <span class="sbo-field__label">Vấn đề bạn muốn giải quyết là gì? <span class="sbo-required" aria-hidden="true">*</span></span>
  <input class="sbo-field__control" type="text" data-sbo-custom="ca50196c-53d5-4752-bdf8-957cbd04cd64" required />
</label>

    <p class="sbo-event-form__feedback" data-sbo-feedback hidden></p>

    <button type="submit" class="sbo-event-form__submit">Đăng ký tham gia</button>
  </form>
</div>
<style>
/*
 * SBO Event form — chỉnh layout / màu tại đây (giống HTML form Kit).
 * Class gợi ý: .sbo-event-form, .sbo-field, .sbo-field__control, .sbo-event-form__submit
 */
.sbo-event-form {
  --sbo-primary: #596788;
  --sbo-text: #0f172a;
  --sbo-muted: #64748b;
  --sbo-border: #e2e8f0;
  --sbo-radius: 0.75rem;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: var(--sbo-text);
  max-width: 32rem;
}
.sbo-event-form__title {
  margin: 0 0 0.5rem;
  font-size: 1.5rem;
  font-weight: 800;
  line-height: 1.25;
}
.sbo-event-form__intro {
  margin: 0 0 1.25rem;
  font-size: 0.9375rem;
  line-height: 1.55;
  color: var(--sbo-muted);
  white-space: pre-wrap;
}
.sbo-field {
  display: block;
  margin-bottom: 1rem;
}
.sbo-field--group {
  border: 0;
  margin: 0 0 1rem;
  padding: 0;
}
.sbo-field__label,
.sbo-field--group .sbo-field__label {
  display: block;
  margin-bottom: 0.375rem;
  font-size: 0.875rem;
  font-weight: 600;
}
.sbo-required {
  color: #ef4444;
}
.sbo-field__control {
  box-sizing: border-box;
  width: 100%;
  border: 1px solid var(--sbo-border);
  border-radius: var(--sbo-radius);
  padding: 0.65rem 0.85rem;
  font-size: 1rem;
  line-height: 1.4;
}
.sbo-field__control:focus {
  outline: 2px solid color-mix(in srgb, var(--sbo-primary) 35%, transparent);
  border-color: var(--sbo-primary);
}
.sbo-field__choices {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  padding: 0.75rem;
  border: 1px solid var(--sbo-border);
  border-radius: var(--sbo-radius);
  background: #f8fafc;
}
.sbo-choice {
  display: flex;
  align-items: flex-start;
  gap: 0.5rem;
  font-size: 0.9375rem;
  cursor: pointer;
}
.sbo-event-form__feedback {
  margin: 0 0 1rem;
  padding: 0.65rem 0.85rem;
  border-radius: var(--sbo-radius);
  font-size: 0.875rem;
}
.sbo-event-form__feedback--success {
  background: #ecfdf5;
  color: #065f46;
  border: 1px solid #a7f3d0;
}
.sbo-event-form__feedback--error {
  background: #fef2f2;
  color: #991b1b;
  border: 1px solid #fecaca;
}
.sbo-event-form__submit {
  width: 100%;
  border: 0;
  border-radius: var(--sbo-radius);
  padding: 0.85rem 1rem;
  font-size: 1rem;
  font-weight: 600;
  color: #fff;
  background: var(--sbo-primary);
  cursor: pointer;
}
.sbo-event-form__submit:disabled {
  opacity: 0.65;
  cursor: not-allowed;
}
</style>
<script>
(function () {
  function collectCustomData(form) {
    var customData = {};
    var checkboxes = {};
    form.querySelectorAll("[data-sbo-custom]").forEach(function (el) {
      var id = el.getAttribute("data-sbo-custom");
      if (!id) return;
      if (el.getAttribute("data-sbo-file-value")) {
        customData[id] = el.value || "";
        return;
      }
      if (el.type === "checkbox") {
        if (!checkboxes[id]) checkboxes[id] = [];
        if (el.checked) checkboxes[id].push(el.value);
        return;
      }
      if (el.type === "radio") {
        if (el.checked) customData[id] = el.value;
        return;
      }
      if (el.type === "file") return;
      customData[id] = el.value || "";
    });
    Object.keys(checkboxes).forEach(function (id) {
      customData[id] = checkboxes[id].join(" | ");
    });
    form.querySelectorAll("[data-sbo-required]").forEach(function (fieldset) {
      var id = fieldset.getAttribute("data-sbo-field");
      if (!id) return;
      var checked = fieldset.querySelector("[data-sbo-checkbox]:checked");
      if (!checked) {
        throw new Error("Vui lòng chọn ít nhất một tùy chọn.");
      }
    });
    return customData;
  }

  function wireFileInputs(form) {
    form.querySelectorAll("[data-sbo-file]").forEach(function (input) {
      input.addEventListener("change", function () {
        var id = input.getAttribute("data-sbo-file");
        var hidden = form.querySelector('[data-sbo-file-value="' + id + '"]');
        if (!hidden) return;
        var file = input.files && input.files[0];
        if (!file) {
          hidden.value = "";
          return;
        }
        if (file.size > 1048576) {
          input.value = "";
          hidden.value = "";
          alert("Tệp tối đa 1MB.");
          return;
        }
        var reader = new FileReader();
        reader.onload = function () {
          hidden.value = typeof reader.result === "string" ? reader.result : "";
        };
        reader.readAsDataURL(file);
      });
    });
  }

  function initForm(root) {
    var form = root.querySelector("form[data-sbo-event-form]");
    if (!form) return;
    var apiUrl = root.getAttribute("data-sbo-api-url");
    var feedback = form.querySelector("[data-sbo-feedback]");
    var submitBtn = form.querySelector("[type=submit]");
    wireFileInputs(form);
    form.addEventListener("submit", function (event) {
      event.preventDefault();
      if (!apiUrl) return;
      if (feedback) {
        feedback.hidden = true;
        feedback.textContent = "";
        feedback.className = "sbo-event-form__feedback";
      }
      if (submitBtn) submitBtn.disabled = true;
      var nameInput = form.querySelector('[name="name"]');
      var phoneInput = form.querySelector('[name="phone"]');
      var emailInput = form.querySelector('[name="email"]');
      var payload = {
        name: nameInput ? nameInput.value.trim() : "",
        phone: phoneInput ? phoneInput.value.trim() : "",
        email: emailInput ? emailInput.value.trim() : "",
        customData: {},
      };
      try {
        payload.customData = collectCustomData(form);
      } catch (err) {
        if (feedback) {
          feedback.hidden = false;
          feedback.textContent = err && err.message ? err.message : "Dữ liệu không hợp lệ.";
          feedback.className = "sbo-event-form__feedback sbo-event-form__feedback--error";
        }
        if (submitBtn) submitBtn.disabled = false;
        return;
      }
      fetch(apiUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      })
        .then(function (res) {
          return res.json().then(function (data) {
            return { res: res, data: data };
          });
        })
        .then(function (_ref) {
          var res = _ref.res;
          var data = _ref.data;
          if (!res.ok || !data.success) {
            throw new Error(data.error || "Không gửi được đăng ký.");
          }
          if (data.redirectTo) {
            window.location.href = data.redirectTo;
            return;
          }
          if (feedback) {
            feedback.hidden = false;
            feedback.textContent = "Đăng ký thành công! Cảm ơn bạn.";
            feedback.className = "sbo-event-form__feedback sbo-event-form__feedback--success";
          }
          form.reset();
        })
        .catch(function (err) {
          if (feedback) {
            feedback.hidden = false;
            feedback.textContent = err && err.message ? err.message : "Không gửi được đăng ký.";
            feedback.className = "sbo-event-form__feedback sbo-event-form__feedback--error";
          }
        })
        .finally(function () {
          if (submitBtn) submitBtn.disabled = false;
        });
    });
  }

  document.querySelectorAll("[data-sbo-event-root]").forEach(initForm);
})();
</script>
</body>
</html>
